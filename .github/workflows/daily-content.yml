name: Daily Content

# Generates a fresh daily brief + featured posts from real trending sources,
# rebuilds the static site, and deploys it to GitHub Pages.
# The growing archive is persisted on a dedicated, bot-owned `content` branch
# so the working branches stay code-only.

on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # push the content branch
  pages: write # deploy Pages
  id-token: write # Pages deployment auth

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test generation behavior
        run: npm test

      - name: Restore archive from content branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code origin refs/heads/content; then
            git fetch origin content
            git show origin/content:posts.json > data/posts.json
            echo "Restored archive ($(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/posts.json")).posts.length)') posts)."
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            echo "No content branch yet — starting a fresh archive."
          fi

      - name: Generate today's content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ vars.MODEL }}
        run: node generate.js

      - name: Build static site
        run: node build.js

      - name: Persist archive before publication
        run: |
          git config user.name "viralengine-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w data/posts.json)
          tree=$(printf '100644 blob %s\tposts.json\n' "$blob" | git mktree)
          if git rev-parse --verify origin/content >/dev/null 2>&1; then
            commit=$(git commit-tree "$tree" -p origin/content -m "content: $(date -u +%F)")
          else
            commit=$(git commit-tree "$tree" -m "content: $(date -u +%F)")
          fi
          git push origin "$commit:refs/heads/content"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
